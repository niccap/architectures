name: Publish Adventure Builder

on:
  push:
    branches: [main]
    paths:
      - 'adventure-builder/**'
      - '.github/workflows/adventure-builder-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build and validate site
        run: |
          python3 adventure-builder/scripts/build_site.py
          python3 adventure-builder/scripts/validate_site.py

      - name: Collect published files
        run: |
          site_dir="${{ runner.temp }}/adventure-builder-pages"
          mkdir -p "$site_dir"
          cp adventure-builder/index.html "$site_dir/"
          cp -R adventure-builder/architecture adventure-builder/templates adventure-builder/assets "$site_dir/"

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/adventure-builder-pages

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
