services:
  mysql:
    image: mysql:latest
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: mypwd
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
  service:
    image: niccap/countries_mysql
    ports:
      - "8080:8080"
    depends_on:
      - mysql

volumes:
  mysql_data:


